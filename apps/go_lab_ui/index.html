<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Lab UI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: sans-serif;
    }
    .box {
      text-align: center;
    }
    button {
      padding: 14px 28px;
      font-size: 18px;
      cursor: pointer;
    }
    #status {
      margin-top: 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <button id="ping-btn" type="button">Ping API</button>
    <div id="status">Нажми кнопку</div>
  </div>

  <script>
    const btn = document.getElementById("ping-btn");
    const statusEl = document.getElementById("status");

    btn.addEventListener("click", async () => {
      statusEl.textContent = "Отправка запроса...";
      try {
        const res = await fetch("/api/ping", { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "Ошибка: " + (data.error || res.status);
          return;
        }
        statusEl.textContent = `Clicks: ${data.clickCount} (version: ${data.version})`;
      } catch (err) {
        statusEl.textContent = "Сетевая ошибка: " + err.message;
      }
    });
  </script>
</body>
</html>
