site_name: Lab Web Platform Docs
site_description: Kubernetes-based web platform — architecture, deployment and runbooks
site_url: https://dplaksa.github.io/lab_web_platform
repo_url: https://github.com/DPlaksa/lab_web_platform
repo_name: DPlaksa/lab_web_platform
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
    - Diagrams:
      - System Context: architecture/diagrams/c4-context.md
      - Containers: architecture/diagrams/c4-containers.md
      - Deployment: architecture/diagrams/deployment.md
    - Decisions (ADR):
      - ADR-001 kubeadm: architecture/decisions/001-use-kubeadm.md
      - ADR-002 Flannel CNI: architecture/decisions/002-use-flannel-cni.md
      - ADR-003 Helm releases: architecture/decisions/003-use-helm-independent-releases.md
      - ADR-004 DB migrations: architecture/decisions/004-db-migrations-in-initdb.md
  - Runbooks:
    - Deploy: runbooks/deploy.md
    - Troubleshooting: runbooks/troubleshooting.md
