replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

initImage:
  repository: alpine
  tag: "3.20"
  pullPolicy: IfNotPresent

release:
  # Repo and release tag from which initContainer will take archive with UI build
  repo: DPlaksa/lab_web_platform
  tag: ui-v0.1.0

service:
  type: ClusterIP
  port: 80

api:
  host: go-lab-api
  port: 8080

proxy:
  connectTimeout: 5s
  readTimeout: 10s