#cloud-config
package_update: true
package_upgrade: true

users:
  - default
  - name: k8s
    gecos: Kubernetes Lab User
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA8CW6HyGvCRkis6EEQyEV8bnwzgwSC3Zx6PppoMTz7s dodo@ThinkPad-X390-Yoga

chpasswd:
  expire: false

ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

runcmd:
  # Harden SSH
  - passwd -l root
  - mkdir -p /etc/ssh/sshd_config.d
  - printf "PermitRootLogin no\nPasswordAuthentication no\nKbdInteractiveAuthentication no\n" > /etc/ssh/sshd_config.d/99-hardening.conf
  - systemctl reload ssh || systemctl reload sshd || true

  # Kernel modules and sysctl for Kubernetes networking
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # Disable swap (required by kubeadm)
  - swapoff -a
  - sed -i '/\sswap\s/d' /etc/fstab

  # Install containerd
  - apt-get install -y containerd
  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  # Add Kubernetes apt repo
  - apt-get install -y apt-transport-https ca-certificates curl gpg conntrack socat
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl

  # Initialize cluster
  - kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=NumCPU

  # Setup kubeconfig for user k8s
  - mkdir -p /home/k8s/.kube
  - cp /etc/kubernetes/admin.conf /home/k8s/.kube/config
  - chown -R k8s:k8s /home/k8s/.kube

  # Allow scheduling on control-plane node (single-node cluster)
  - kubectl --kubeconfig=/etc/kubernetes/admin.conf taint nodes --all node-role.kubernetes.io/control-plane-

  # Install Flannel CNI
  - kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

power_state:
  mode: reboot
  delay: now
  message: "Rebooting after cloud-init"
  condition: true
